name: Tests

on:
  pull_request:
  push:
    branches:
      - master

env:
  MAKE_PARALLEL: 2

jobs:
  test:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, ruby: '3.1', botan: '3.14.0' }
          - { os: ubuntu-latest, ruby: '3.4', botan: '3.14.0' }
          - { os: ubuntu-latest, ruby: '3.4', botan: '2.13.0' }
          - { os: macos-latest, ruby: '3.4', botan: '3.14.0' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache Botan build
        id: botan-cache
        uses: actions/cache@v4
        with:
          path: ~/botan-install
          key: botan-${{ matrix.botan }}-${{ runner.os }}

      - name: Build Botan from source
        run: |
          suffix=3
          [ "${{ matrix.botan }}" = "2.13.0" ] && suffix=2
          prefix="$HOME/botan-install"
          if [ -e "$prefix/lib/libbotan-$suffix.dylib" ] || [ -e "$prefix/lib/libbotan-$suffix.so" ]; then
            echo "Botan ${{ matrix.botan }} already installed"
            exit 0
          fi
          git clone --depth 1 --branch "${{ matrix.botan }}" https://github.com/randombit/botan.git /tmp/botan-src
          cd /tmp/botan-src
          ./configure.py --prefix="$prefix"
          make -j${MAKE_PARALLEL} install

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}

      - name: Run tests
        run: |
          bundle install --jobs 4 --retry 3
          suffix=3
          [ "${{ matrix.botan }}" = "2.13.0" ] && suffix=2
          export BOTAN_FFI_LIBRARY="$HOME/botan-install/lib/libbotan-$suffix.dylib"
          [ -e "$BOTAN_FFI_LIBRARY" ] || export BOTAN_FFI_LIBRARY="$HOME/botan-install/lib/libbotan-$suffix.so"
          bundle exec rake
